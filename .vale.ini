#
#   Configuration file for Vale to use when evaluating the text of the
#   Markdown docs and the OpenAPI spec in the Rock-Rankers API project.
#   Based on the UWC2 API documentation course configuration.
#
StylesPath = .github/valeStyles
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure, text.frontmatter
Vocab = ProjectTerms
MinAlertLevel = suggestion
Packages = Google, proselint, write-good, Readability
#
# Markdown docs
[*.md]
BasedOnStyles = Vale, Google, write-good, Readability
write-good.E-Prime = NO
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = YES
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
Readability.Polysyllables = NO
Vale.Terms = YES
#
# OpenAPI spec: check only the prose (titles, summaries and descriptions)
[*-spec.{yml,yaml}]
BasedOnStyles = Vale, Google, write-good
write-good.E-Prime = NO
View = OpenAPI
